# Dependabot Configuration
# GitHub-native dependency update automation (replaces the deleted
# dependency-update.yml workflow, which failed weekly with contents:read 403s).
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm dependencies: weekly batch of minor/patch bumps; major bumps get
  # their own PRs (they are excluded from the group by default).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Known-rejected major bumps: each migration is deliberate separate work,
    # tracked in the dependency-migrations tracking issue. Ignoring only the
    # future majors keeps minor/patch (and security) updates flowing.
    ignore:
      # Repo pins Node 24 (ci.yml NODE_VERSION, engines >=24); dev types must
      # track the runtime major.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # ESLint 10: needs flat-config/Jest-ESM migration work.
      - dependency-name: "eslint"
        versions: [">=10"]
      # isomorphic-dompurify 3+: breaking API change; migration is someday-work.
      - dependency-name: "isomorphic-dompurify"
        versions: [">=3"]
      # lucide-react 1.x: breaking icon API changes; migrate deliberately.
      - dependency-name: "lucide-react"
        versions: [">=1"]
      # @typesafe-ai/sdk 0.7: minor bump breaks the Jev categorize callback
      # type (TS2322 in scripts/jev-categorize.ts); migrate deliberately.
      - dependency-name: "@typesafe-ai/sdk"
        versions: [">=0.7"]

  # GitHub Actions: weekly, all action bumps batched into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
