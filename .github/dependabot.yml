# Dependabot Configuration
# GitHub-native dependency update automation (replaces the deleted
# dependency-update.yml workflow, which failed weekly with contents:read 403s).
# https://docs.github.com/en/code-security/dependabot

version: 2

# Rejected major bumps: each needs deliberate migration work tracked in the
# repo's dependency-migrations issue — Dependabot stops re-raising these, while
# minor/patch and security updates for the same deps still flow.
ignore:
  - dependency-name: "@types/node"
    versions: [">=25"]          # types must track the Node 24 runtime major
  - dependency-name: "eslint"
    versions: [">=10"]          # eslint 10 migration is deliberate follow-up work
  - dependency-name: "isomorphic-dompurify"
    versions: [">=3"]           # v4 needs API migration work
  - dependency-name: "lucide-react"
    versions: [">=1"]           # 1.x needs icon API migration work

updates:
  # npm dependencies: weekly batch of minor/patch bumps; major bumps get
  # their own PRs (they are excluded from the group by default).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: weekly, all action bumps batched into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
