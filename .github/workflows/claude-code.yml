name: Claude Code Assistant

# ON-DEMAND ONLY: the automatic pull_request/issues triggers were removed.
# In September 2026 the auto-trigger ran this ~46 times and its findings
# artifact never surfaced anywhere. It now runs only when a trusted author
# comments '@claude' on an open PR/issue, or via workflow_dispatch.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# SECURITY: every trigger is gated to trusted authors (OWNER/MEMBER/COLLABORATOR)
# and excludes bot accounts. This workflow holds a repo-write GITHUB_TOKEN and
# executes npm ci, so it must never run on content from anonymous users.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  # Required by claude-code-action: it exchanges an OIDC token for a GitHub
  # App token. The trusted-author gate above is the security boundary here.
  id-token: write

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest
    # On-demand only: '@claude' comment on an open issue/PR from a trusted
    # author, or a manual workflow_dispatch
    if: |
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.state == 'open' &&
         contains(github.event.comment.body, '@claude') &&
         github.event.comment.user.type != 'Bot' &&
         (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Merged from the two former jobs: both result files are seeded up front
      # so the `if: always()` artifact uploads below never fail on a missing file.
      - name: Create output file
        run: |
          mkdir -p /tmp/claude-output
          echo '{"findingsMarkdown":"","findingsJson":[]}' > /tmp/claude-output/review-results.json
          echo '{"triageMarkdown":"","actions":[],"summary":{"criticalFixed":0,"issuesCreated":0,"skipped":0}}' > /tmp/claude-output/triage-results.json

      - name: Run Code Review
        id: review
        uses: anthropics/claude-code-action@ac1a3207f3f00b4a37e2f3a6f0935733c7c64651  # v1.0.11
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_ZAI_API_KEY }}
          claude_args: |
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Write,Bash(cat:*)"
            --max-turns 15
          settings: |
            {
              "instructions": "## CODE REVIEW TASK\\n\\nYou are reviewing PR #${{ github.event.pull_request.number || github.event.issue.number }}.\\n\\n### CRITICAL RULES - READ CAREFULLY\\n\\n1. **REVIEW THE CODE, NOT THE WORKFLOW** - Analyze the actual source code changes in this PR. Do NOT discuss the review process, workflow architecture, or how you are conducting the review.\\n\\n2. **BE CONCISE** - Each finding should be 2-3 sentences maximum. No lengthy explanations. No meta-commentary.\\n\\n3. **ONLY REPORT ACTUAL ISSUES** - Report bugs, security vulnerabilities, code quality problems. Do NOT report hypothetical concerns or suggestions for improvement unless they fix a real bug.\\n\\n4. **USE STRUCTURED FORMAT** - Write findings to JSON file, nothing else.\\n\\n### WHAT TO LOOK FOR\\n\\n- Security issues (injection, auth bypass, secrets exposure)\\n- Bugs (null refs, type errors, logic errors)\\n- Breaking changes (API changes, removed exports)\\n- Unused variables or imports\\n- Missing error handling for critical paths\\n\\n### OUTPUT FORMAT\\n\\nWrite to /tmp/claude-output/review-results.json:\\n\\n```json\\n{\\n  \\\"findingsMarkdown\\\": \\\"Brief summary of issues found\\\",\\n  \\\"findingsJson\\\": [\\n    {\\\"id\\\":\\\"F-001\\\",\\\"severity\\\":\\\"critical|medium|low\\\",\\\"category\\\":\\\"security|bug|quality\\\",\\\"file\\\":\\\"path/to/file.ts\\\",\\\"lineStart\\\":10,\\\"lineEnd\\\":15,\\\"title\\\":\\\"Brief title\\\",\\\"description\\\":\\\"What is wrong (1-2 sentences)\\\",\\\"recommendation\\\":\\\"How to fix (1 sentence)\\\"}\\n  ]\\n}\\n```\\n\\nIf no issues: `{\\\"findingsMarkdown\\\":\\\"No issues found.\\\",\\\"findingsJson\\\":[]}`\\n\\nAfter writing, run: cat /tmp/claude-output/review-results.json",
              "env": {
                "NODE_ENV": "test",
                "CI": "true",
                "PR_NUMBER": "${{ github.event.pull_request.number || github.event.issue.number }}"
              }
            }
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          GH_TOKEN: ${{ github.token }}

      # Same runner as the review step above, so /tmp/claude-output/review-results.json
      # persists here — no artifact download step needed.
      - name: Triage and Act
        uses: anthropics/claude-code-action@ac1a3207f3f00b4a37e2f3a6f0935733c7c64651  # v1.0.11
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_ZAI_API_KEY }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(git:add*),Bash(git:commit*),Bash(git:push),Bash(git:status*),Bash(git:diff*),Bash(git:config*),Bash(node:*),Bash(gh:*),Bash(cat:*)"
            --max-turns 20
          settings: |
            {
              "instructions": "## TRIAGE TASK\\n\\nProcess findings from the code review for PR #${{ github.event.pull_request.number || github.event.issue.number }}.\\n\\n### CRITICAL RULES\\n\\n1. **NO META-COMMENTARY** - Do not discuss the triage process. Just process and output results.\\n\\n2. **ACTION ONLY** - For each finding, take action or skip. No lengthy explanations.\\n\\n### STEPS\\n\\n1. Run: cat /tmp/claude-output/review-results.json\\n2. Extract findingsJson from the file\\n3. Process each:\\n   - CRITICAL: Fix code, run tests, commit, push\\n   - MEDIUM/LOW: Create issue with gh issue create\\n   - Skip if not applicable\\n\\n### OUTPUT FORMAT\\n\\nWrite to /tmp/claude-output/triage-results.json:\\n\\n```json\\n{\\n  \\\"triageMarkdown\\\": \\\"Fixed N critical, created M issues, skipped K\\\",\\n  \\\"actions\\\": [{\\\"findingId\\\":\\\"F-001\\\",\\\"action\\\":\\\"fixed|issue|skipped\\\",\\\"details\\\":\\\"Brief note\\\"}],\\n  \\\"summary\\\": {\\\"criticalFixed\\\":N,\\\"issuesCreated\\\":M,\\\"skipped\\\":K}\\n}\\n```\\n\\nAfter writing, run: cat /tmp/claude-output/triage-results.json",
              "env": {
                "NODE_ENV": "test",
                "CI": "true",
                "PR_NUMBER": "${{ github.event.pull_request.number || github.event.issue.number }}"
              }
            }
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          GH_TOKEN: ${{ github.token }}

      - name: Upload review results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: review-results
          path: /tmp/claude-output/review-results.json
          retention-days: 1

      - name: Upload triage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: triage-results
          path: /tmp/claude-output/triage-results.json
          retention-days: 1
