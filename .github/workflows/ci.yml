name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

env:
  NODE_VERSION: '20'
  CACHE_VERSION: 'v1'

# Global permissions for security
# (security-events: write was only needed by CodeQL, which now lives in security.yml)
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: default to running the heavy jobs unless we positively
          # determine the change touches only data/ or public/data/.
          code="true"
          files=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename') || files=""
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              files=$(git diff --name-only "$before" HEAD) || files=""
            fi
          fi

          # Only skip the heavy jobs when we have a non-empty file list and
          # every changed file is under a data path. Empty list or errors
          # (e.g. shallow-clone diff failure, API error) keep code="true".
          if [[ -n "$files" ]]; then
            data_only="true"
            while IFS= read -r f; do
              case "$f" in
                data/*|public/data/*) ;;
                ?*) data_only="false" ; break ;;
              esac
            done <<< "$files"
            if [[ "$data_only" == "true" ]]; then
              code="false"
            fi
          fi

          echo "Changed files:"
          echo "$files"
          echo "data-only change (skip heavy jobs): $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage reports
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    # Build still runs for data-only PRs (lint/test skipped) so the site keeps compiling.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-files
          path: |
            .next/
            out/
            public/
          retention-days: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # Production deps must stay vuln-free. Known dev-only highs (extract-zip
        # via puppeteer, js-yaml via istanbul) are tracked in security.yml.
        # CodeQL runs once in security.yml (security-extended,security-and-quality).
        run: npm audit --omit=dev --audit-level moderate

  scan-test:
    name: Test Scan Scripts
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          echo "GITHUB_TOKEN=test_token" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Test scan scripts (dry run)
        run: |
          npm run scan:marketplaces -- --dry-run
          npm run validate:plugins -- --dry-run
          npm run generate:data -- --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [changes, lint, test, build, security, scan-test]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Change Detection | ${{ needs.changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and Type Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Scripts Test | ${{ needs.scan-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 'skipped' counts as passing (skipped jobs are expected on data-only changes)
          if [[ "${{ needs.changes.result }}" == "success" && ("${{ needs.lint.result }}" == "success" || "${{ needs.lint.result }}" == "skipped") && ("${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped") && ("${{ needs.build.result }}" == "success" || "${{ needs.build.result }}" == "skipped") && ("${{ needs.security.result }}" == "success" || "${{ needs.security.result }}" == "skipped") && ("${{ needs.scan-test.result }}" == "success" || "${{ needs.scan-test.result }}" == "skipped") ]]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
          fi