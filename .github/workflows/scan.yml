name: Scan Marketplaces

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - marketplaces
          - validation
          - data
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean
      commit_changes:
        description: 'Commit changes automatically'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '24'
  CACHE_VERSION: 'v1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "scan"
  cancel-in-progress: false

jobs:
  scan-marketplaces:
    name: Scan for New Marketplaces
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'marketplaces' || github.event.inputs.scan_type == 'full' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run marketplace scan
        run: npm run scan:marketplaces
        env:
          # The scan issues thousands of API calls; the PAT's 5,000/hr user
          # pool keeps it from exhausting the shared repo-token quota that
          # auto-merge and other workflows depend on.
          GITHUB_TOKEN: ${{ secrets.DATA_UPDATES_PAT }}
          NODE_ENV: production
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marketplace-scan-results
          path: data/marketplaces/
          retention-days: 1

  validate-plugins:
    name: Validate Plugins
    runs-on: ubuntu-latest
    needs: scan-marketplaces
    if: github.event.inputs.scan_type == 'validation' || github.event.inputs.scan_type == 'full' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: marketplace-scan-results
          path: data/marketplaces/

      - name: Run plugin validation
        run: npm run validate:plugins
        env:
          # Same rate-limit pool consideration as the scan job above.
          GITHUB_TOKEN: ${{ secrets.DATA_UPDATES_PAT }}
          NODE_ENV: production

      - name: Upload validation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plugin-validation-results
          path: data/plugins/
          retention-days: 1

  generate-data:
    name: Generate Data Files
    runs-on: ubuntu-latest
    needs: [scan-marketplaces, validate-plugins]
    if: github.event.inputs.scan_type == 'data' || github.event.inputs.scan_type == 'full' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download previous artifacts
        # Download each artifact into its original directory layout.
        # A single merged download would flatten data/marketplaces/* to
        # data/* and generate-data would silently fall back to stale
        # snapshots committed under data/marketplaces/.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: marketplace-scan-results
          path: data/marketplaces/

      - name: Download validation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: plugin-validation-results
          path: data/plugins/

      - name: Enrich categories with Jev
        # Enhancement, not load-bearing: the sidecar merges additively and the
        # script writes only after a full pass, so a partial or skipped run
        # leaves the previously committed jev-enrichment.json in place.
        continue-on-error: true
        env:
          NODE_ENV: production
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ] && [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "ℹ️ No Jev provider key configured (TYPESAFE_API_KEY / AI_GATEWAY_API_KEY) — skipping category enrichment"
            exit 0
          fi
          npm run enrich:jev

      - name: Generate data files
        run: npm run generate:data
        env:
          NODE_ENV: production

      - name: Validate generated data
        run: npm run validate:data
        env:
          NODE_ENV: production

      - name: Upload generated data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-data
          path: |
            data/
            public/data/
          retention-days: 1

  commit-changes:
    name: Commit Changes
    runs-on: ubuntu-latest
    needs: [scan-marketplaces, validate-plugins, generate-data]
    if: (github.event.inputs.commit_changes == 'true' || github.event_name == 'schedule') && needs.generate-data.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download generated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: generated-data
          path: ./

      - name: Remove retired legacy payloads
        # complete.json/data.min.json stopped being generated in #360, but
        # download-artifact only OVERLAYS files onto the checkout — the
        # committed copies from main would survive every artifact download
        # and the data-update PR would never record their deletion. Delete
        # them explicitly so the removal lands exactly once, after which
        # this step is a harmless no-op.
        run: |
          rm -f data/generated/complete.json data/generated/data.min.json \
                public/data/complete.json public/data/data.min.json

      - name: Create data update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        id: create-pr
        with:
          token: ${{ secrets.DATA_UPDATES_PAT }}
          commit-message: |
            🔄 Update marketplace data

            - Automated marketplace scan results
            - Plugin validation updates
            - Generated data files

            Trigger: ${{ github.event_name }}
            Scan type: ${{ github.event.inputs.scan_type || 'full' }}
          branch: automated/marketplace-data-update
          delete-branch: true
          title: "🔄 Automated marketplace data update"
          body: |
            ## Automated Data Update

            This PR was created by the Scan Marketplaces workflow.

            **Scan details:**
            - Trigger: `${{ github.event_name }}`
            - Scan type: `${{ github.event.inputs.scan_type || 'full' }}`

            This PR will be auto-approved if only data files are modified.
          add-paths: |
            data/
            public/data/
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Summary
        if: steps.create-pr.outputs.pull-request-number
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          echo "Created/updated PR number: ${PR_NUMBER}"

  notify:
    name: Notify Scan Results
    runs-on: ubuntu-latest
    needs: [scan-marketplaces, validate-plugins, generate-data, commit-changes]
    if: always()

    steps:
      - name: Build scan summary
        run: |
          echo "## 📊 Marketplace Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace Scan | ${{ needs.scan-marketplaces.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin Validation | ${{ needs.validate-plugins.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Generation | ${{ needs.generate-data.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Changes | ${{ needs.commit-changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.scan-marketplaces.result }}" == "success" && "${{ needs.validate-plugins.result }}" == "success" && "${{ needs.generate-data.result }}" == "success" ]]; then
            echo "✅ **Scan completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "${{ needs.commit-changes.result }}" == "success" ]]; then
              echo "📝 **Changes have been committed to the repository.**" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **No changes were committed (either no changes found or commit failed).**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Scan encountered issues.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the failed jobs for more details." >> $GITHUB_STEP_SUMMARY
          fi
