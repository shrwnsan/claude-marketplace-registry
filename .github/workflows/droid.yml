name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  droid:
    # SECURITY: gated to trusted authors (OWNER/MEMBER/COLLABORATOR), excluding bots.
    # This workflow holds a repo-write GITHUB_TOKEN driven by comment text, so it
    # must never be triggerable by anonymous users.
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.state == 'open' && contains(github.event.comment.body, '@droid') && github.event.comment.user.type != 'Bot' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.pull_request.state == 'open' && contains(github.event.comment.body, '@droid') && github.event.comment.user.type != 'Bot' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open' && contains(github.event.review.body, '@droid') && github.event.review.user.type != 'Bot' && (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'issues' && github.event.issue.state == 'open' && (contains(github.event.issue.body, '@droid') || contains(github.event.issue.title, '@droid')) && github.event.issue.user.type != 'Bot' && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # Required by droid-action's OIDC-based auth; trusted-author gate above
      # is the security boundary.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Droid Exec
        uses: Factory-AI/droid-action@7e4b9ade9d2dd35cff9c9b0b83502697253aee51  # v1
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
